name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: knowledge_explorer
          POSTGRES_PASSWORD: knowledge_explorer
          POSTGRES_DB: knowledge_explorer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledge_explorer -d knowledge_explorer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        # No port conflict on a CI runner, so the container maps to 6379 here
        # even though local development maps it to 6380.
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://knowledge_explorer:knowledge_explorer@localhost:5432/knowledge_explorer
      REDIS_URL: redis://localhost:6379
      AUTH_URL: http://localhost:3000
      # Where the browser suite reaches apps/api; must match the API's CORS origin.
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Test-only value. Real secrets never live in this file.
      AUTH_SECRET: ci-only-secret-not-used-for-any-real-session
      # Object storage. Port 9000 is free on a runner, unlike the development
      # machine where Compose maps MinIO to 9010. The two endpoints hold the
      # same value here because everything runs on the runner host.
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: knowledge-explorer-media
      S3_ACCESS_KEY_ID: knowledge_explorer
      S3_SECRET_ACCESS_KEY: knowledge_explorer
      # The deterministic fake: CI never calls a paid provider.
      IMAGE_PROVIDER: fake

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # MinIO cannot be a `services:` container: GitHub Actions has no way to set
      # a container command, and this image does nothing without `server /data`.
      # An explicit step is the whole workaround.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=knowledge_explorer \
            -e MINIO_ROOT_PASSWORD=knowledge_explorer \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data --console-address ":9001"
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO ready"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready"
          docker logs minio
          exit 1

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      # `lint` currently matches no package script and is a no-op; it stays in
      # the sequence so that choosing a linter needs no CI change.
      - run: pnpm exec turbo run typecheck lint test

      # The browser suite is a separate step because its package script is
      # `test:e2e`, not `test` — `turbo run test` stays runnable without browsers.
      - run: pnpm --filter @knowledge-explorer/admin-web exec playwright install --with-deps chromium

      - run: pnpm --filter @knowledge-explorer/admin-web run test:e2e
