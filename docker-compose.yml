services:
  postgres:
    image: postgres:16
    container_name: knowledge-explorer-postgres
    environment:
      POSTGRES_USER: knowledge_explorer
      POSTGRES_PASSWORD: knowledge_explorer
      POSTGRES_DB: knowledge_explorer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_explorer -d knowledge_explorer"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: knowledge-explorer-redis
    ports:
      # Host 6380: a native redis-server already holds 6379 on this machine.
      # Container-internal port is unchanged, so CI (no conflict) can map 6379 directly.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    # quay.io, not Docker Hub: `docker pull minio/minio` is denied for
    # unauthenticated clients, while quay.io serves the same images anonymously.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: knowledge-explorer-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: knowledge_explorer
      MINIO_ROOT_PASSWORD: knowledge_explorer
    ports:
      # Host 9010/9011: a native php-fpm already holds 9000 on this machine.
      # Container-internal ports are unchanged, so CI (no conflict) maps 9000
      # directly — the same split this file already uses for Redis.
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  minio-data:
